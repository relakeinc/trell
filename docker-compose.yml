# Trell — self-host via Docker Compose.
# Run:  docker compose up -d --build
# Secrets come from a root `.env` (copy `.env.example`). See docs/selfhost.md.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trell}
      POSTGRES_DB: ${POSTGRES_DB:-trell}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trell} -d ${POSTGRES_DB:-trell}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies the Prisma schema before api/web start (kept separate).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "cd apps/api && pnpm db:push --skip-generate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "8787"
      TRELL_ADMIN_KEY: ${TRELL_ADMIN_KEY}
      TRELL_PK_PREFIX: ${TRELL_PK_PREFIX:-pk}
      TRELL_SK_PREFIX: ${TRELL_SK_PREFIX:-sk}
      TRELL_RATE_LIMIT_MAX: ${TRELL_RATE_LIMIT_MAX:-300}
    command: ["sh", "-c", "cd apps/api && pnpm start"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${PUBLIC_URL}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${PUBLIC_URL}
      TRELL_API_URL: http://api:8787
      TRELL_ENC_KEY: ${TRELL_ENC_KEY}
    command: ["sh", "-c", "cd apps/web && pnpm start"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  pg_data:
