services:
  mcp:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "cd apps/api && pnpm start"]
    env_file: [.env]
    ports:
      - "127.0.0.1:8788:8788"
    networks: [trellnet]
    restart: unless-stopped

networks:
  trellnet:
    external: true
    name: trell_default
